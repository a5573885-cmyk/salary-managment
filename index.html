<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪資管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS & JS (用於日曆選取) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">薪資與工時管理系統</h1>
            <p class="text-gray-600 mt-2">記錄工作時段、計算薪資與檢視歷史紀錄</p>
        </header>

        <!-- 篩選與操作區 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">開始日期</label>
                    <input type="text" id="startDate" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="選擇開始日期">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">結束日期</label>
                    <input type="text" id="endDate" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="選擇結束日期">
                </div>
                <div class="flex space-x-2">
                    <button id="filterBtn" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">篩選</button>
                    <button id="resetBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition">重置</button>
                </div>
            </div>
        </div>

        <!-- 數據總結卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-medium">總工作時數</h3>
                <p id="totalHours" class="text-2xl font-bold text-gray-800 mt-2">0 小時</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-medium">預估總薪資</h3>
                <p id="totalSalary" class="text-2xl font-bold text-gray-800 mt-2">$0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
                <h3 class="text-gray-500 text-sm font-medium">記錄筆數</h3>
                <p id="totalRecords" class="text-2xl font-bold text-gray-800 mt-2">0 筆</p>
            </div>
        </div>

        <!-- 列表區域 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-medium text-gray-800">薪資紀錄清單</h3>
                <button onclick="alert('示範按鈕：可在此觸發新增資料 Modal')" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 transition">+ 新增紀錄</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">時段</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">時数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">時薪</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">小計</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 動態生成內容 -->
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" colspan="5" style="text-align: center;">尚無資料或請點擊篩選</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 初始化 Flatpickr 與互動邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化日曆選取 (Flatpickr) 統一格式為中文語系與 YYYY-MM-DD
            flatpickr("#startDate", {
                locale: "zh_tw",
                dateFormat: "Y-m-d",
            });

            flatpickr("#endDate", {
                locale: "zh_tw",
                dateFormat: "Y-m-d",
            });

            // 示範按鈕點擊事件
            document.getElementById('filterBtn').addEventListener('click', function() {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                if(!start || !end) {
                    alert('請完整選擇開始與結束日期！');
                    return;
                }
                alert(`正在篩選由 ${start} 至 ${end} 的資料...`);
                // 這裡可串接原本 GitHub 專案的資料篩選函式
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
            });
        });
    </script>
</body>
</html>
