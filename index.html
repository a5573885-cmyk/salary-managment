<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薪資與時薪計算器</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --aud-color: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      text-align: center;
      color: #1a1a1a;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    /* Switch 切換開關樣式 */
    .switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .switch-label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary-color);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* 結果顯示區域 */
    .result-box {
      background-color: #f1f3f5;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }

    .rate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .rate-row:not(:last-child) {
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .rate-label {
      font-size: 0.95rem;
      color: #666;
    }

    .rate-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .rate-value.aud {
      color: var(--aud-color);
    }

    /* 動態隱藏 Class */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>時薪與匯率計算</h2>

    <!-- 輸入欄位：台幣時薪 -->
    <div class="form-group">
      <label for="twdRate">時薪 (TWD)</label>
      <input type="number" id="twdRate" value="250" min="0" placeholder="請輸入台幣金額">
    </div>

    <!-- 匯率開關 -->
    <div class="switch-group">
      <span class="switch-label">啟用匯率換算</span>
      <label class="switch">
        <input type="checkbox" id="exchangeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- 輸入欄位：匯率 (預設隱藏) -->
    <div class="form-group hidden" id="exchangeRateGroup">
      <label for="audRate">匯率 (1 AUD 相當於多少 TWD)</label>
      <input type="number" id="audRate" value="20.8" step="0.1" min="0.1">
    </div>

    <!-- 時薪結果顯示區 -->
    <div class="result-box">
      <!-- 未啟用匯率時：預設顯示標籤為「時薪」 -->
      <div class="rate-row">
        <span class="rate-label" id="twdLabel">時薪</span>
        <span class="rate-value" id="twdResult">NT$ 250</span>
      </div>

      <!-- 啟用匯率時：同時顯示澳幣金額 -->
      <div class="rate-row hidden" id="audResultRow">
        <span class="rate-label">時薪</span>
        <span class="rate-value aud" id="audResult">A$ 0.00</span>
      </div>
    </div>
  </div>

  <script>
    // 取得 DOM 元素
    const twdRateInput = document.getElementById('twdRate');
    const audRateInput = document.getElementById('audRate');
    const exchangeToggle = document.getElementById('exchangeToggle');
    
    const exchangeRateGroup = document.getElementById('exchangeRateGroup');
    const audResultRow = document.getElementById('audResultRow');
    
    const twdLabel = document.getElementById('twdLabel');
    const twdResult = document.getElementById('twdResult');
    const audResult = document.getElementById('audResult');

    // 計算並更新介面
    function updateRates() {
      const twdVal = parseFloat(twdRateInput.value) || 0;
      const exchangeRateVal = parseFloat(audRateInput.value) || 1;
      const isEnabled = exchangeToggle.checked;

      // 更新台幣金額
      twdResult.textContent = `NT$ ${twdVal.toLocaleString('zh-TW')}`;

      // 根據開關狀態決定顯示邏輯
      if (isEnabled) {
        // 啟用時：顯示台幣與澳幣兩個欄位，標示幣別
        twdLabel.textContent = '時薪 (TWD)';
        
        const audVal = (twdVal / exchangeRateVal).toFixed(2);
        audResult.textContent = `A$ ${parseFloat(audVal).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

        exchangeRateGroup.classList.remove('hidden');
        audResultRow.classList.remove('hidden');
      } else {
        // 未啟用時：隱藏 AUD 相關欄位，並將預設欄位標籤恢復為單純的「時薪」
        twdLabel.textContent = '時薪';
        
        exchangeRateGroup.classList.add('hidden');
        audResultRow.classList.add('hidden');
      }
    }

    // 事件監聽
    twdRateInput.addEventListener('input', updateRates);
    audRateInput.addEventListener('input', updateRates);
    exchangeToggle.addEventListener('change', updateRates);

    // 初始化頁面
    updateRates();
  </script>

</body>
</html>
